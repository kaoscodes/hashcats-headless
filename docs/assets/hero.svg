<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="480" viewBox="0 0 1280 480" role="img" aria-labelledby="title desc">
  <title id="title">Hashcats — Mine from the terminal.</title>
  <desc id="desc">A geometric white cat on a dark grid beside the Hashcats headless GPU miner title. Native WebGPU. CPU-verified proofs.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#202024" stroke-width="1"/></pattern>
    <radialGradient id="glow"><stop stop-color="#404048" stop-opacity=".6"/><stop offset="1" stop-color="#09090b" stop-opacity="0"/></radialGradient>
    <linearGradient id="face" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#a1a1aa"/></linearGradient>
  </defs>
  <rect width="1280" height="480" rx="20" fill="#09090b"/>
  <rect x="1" y="1" width="1278" height="478" rx="19" fill="url(#grid)" stroke="#27272a"/>
  <ellipse cx="1000" cy="235" rx="310" ry="230" fill="url(#glow)"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="64" y="62" width="194" height="30" rx="15" fill="#18181b" stroke="#3f3f46"/>
    <circle cx="82" cy="77" r="3" fill="#fafafa"/>
    <text x="95" y="81" fill="#d4d4d8" font-size="11" letter-spacing="2">HEADLESS / NATIVE</text>
    <text x="60" y="193" fill="#fafafa" font-size="84" font-weight="700" letter-spacing="-5">Hashcats</text>
    <text x="64" y="251" fill="#fafafa" font-size="34" letter-spacing="-1">Mine from the terminal.</text>
    <text x="65" y="297" fill="#a1a1aa" font-size="19">Native WebGPU. CPU-verified proofs.</text>
    <path d="M64 350H702" stroke="#3f3f46"/>
    <text x="65" y="391" fill="#d4d4d8" font-family="monospace" font-size="15">$ node src/cli.js mine</text>
    <text x="65" y="429" fill="#71717a" font-size="12" letter-spacing="2">METAL  /  VULKAN  /  D3D12</text>
  </g>
  <g transform="translate(856 102)">
    <path d="M0 0L84 50H176L260 0V193L130 270L0 193Z" fill="url(#face)"/>
    <path d="M0 0L84 50L0 100Z" fill="#71717a"/>
    <path d="M260 0L176 50L260 100Z" fill="#d4d4d8"/>
    <path d="M0 193L130 161V270Z" fill="#d4d4d8"/>
    <path d="M260 193L130 161V270Z" fill="#a1a1aa"/>
    <path d="M43 110L98 126L75 149L43 138ZM217 110L162 126L185 149L217 138Z" fill="#09090b"/>
    <path d="M116 171H144L130 188Z" fill="#09090b"/>
  </g>
  <path d="M810 410H1168" stroke="#3f3f46"/>
  <g fill="#a1a1aa" font-family="monospace" font-size="11"><text x="810" y="435">KECCAK-256</text><text x="1083" y="435">GPU → PROOF</text></g>
</svg>
